name: Check and publish public works

on:
  push:
    branches: [main]
    paths:
      - 'projects/world-definition/**'
      - 'projects/vocal-fluctuation-lab/**'
      - 'scripts/build_public_site.py'
      - 'web/**'
      - '.github/workflows/public-works.yml'
  pull_request:
    paths:
      - 'projects/world-definition/**'
      - 'projects/vocal-fluctuation-lab/**'
      - 'scripts/build_public_site.py'
      - 'web/**'
      - '.github/workflows/public-works.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-works-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check game and local server
        run: |
          node --check projects/world-definition/app.js
          node --check projects/world-definition/renderer.js
          node projects/world-definition/tests/engine.test.js
          node projects/world-definition/tests/mystery.test.js
          node projects/world-definition/tests/app-input.test.js
          node projects/world-definition/tests/progress.test.js
          node projects/world-definition/tests/session.test.js
          python -m unittest discover -s projects/world-definition/tests -p 'test_*.py'
      - name: Check vocal fluctuation analysis and notebook
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version >/dev/null
          python -m pip install -r projects/vocal-fluctuation-lab/requirements.txt 'ipywidgets>=8.1,<9' 'nbformat>=5.10,<6' 'yt-dlp[default]>=2026.10.26'
          python -m unittest discover -s projects/vocal-fluctuation-lab/tests -p 'test_*.py'
          node --check projects/vocal-fluctuation-lab/web/app.js
      - name: Build selected public files and distribution ZIP
        run: python scripts/build_public_site.py
      - name: Check educational examples and generated result data
        run: |
          node projects/vocal-fluctuation-lab/tests/web.test.js _site/vocal-fluctuation-lab/data
          node projects/vocal-fluctuation-lab/tests/learning.test.js
          node projects/vocal-fluctuation-lab/tests/interaction.test.js _site/vocal-fluctuation-lab/data
          node projects/vocal-fluctuation-lab/tests/public-links.test.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
