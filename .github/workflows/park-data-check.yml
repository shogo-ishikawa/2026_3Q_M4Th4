name: Update official park catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/park-data-check.yml'
      - 'projects/park-itinerary-lab/scripts/update_park_data.py'
      - 'projects/park-itinerary-lab/scripts/update_food_menus.py'
      - 'projects/park-itinerary-lab/scripts/update_calendar.py'
      - 'projects/park-itinerary-lab/scripts/official_http.py'
      - 'projects/park-itinerary-lab/web/data/parks.json'
  pull_request:
    paths:
      - '.github/workflows/park-data-check.yml'
      - 'projects/park-itinerary-lab/scripts/official_http.py'
      - 'projects/park-itinerary-lab/scripts/update_park_data.py'
      - 'projects/park-itinerary-lab/scripts/update_food_menus.py'
  workflow_dispatch:
    inputs:
      visit_date:
        description: '照合する日付（YYYY-MM-DD、空欄は日本時間の当日）'
        required: false
        type: string
  schedule:
    - cron: '15 21 * * *' # 06:15 JST, before park opening

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('park-catalogue-check-{0}', github.event.pull_request.number) || 'park-data-publication' }}
  cancel-in-progress: false

jobs:
  check-official-network:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official lists without publishing
        run: python projects/park-itinerary-lab/scripts/update_park_data.py --output "${{ runner.temp }}/catalogue.json"
      - name: Check official menu links from both parks
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib,sys
          sys.path.insert(0,'projects/park-itinerary-lab/scripts')
          from update_food_menus import refresh_food
          catalogue=json.loads(pathlib.Path('projects/park-itinerary-lab/web/data/parks.json').read_text())
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          for park in catalogue['parks']:
              activity=next(a for a in park['activities'] if a['category']=='restaurant')
              result=refresh_food(activity,date)
              print(park['id'],result['menuStatus'],result['menuUrl'],len(result['menuItems']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-network-${{ matrix.os }}
          path: ${{ runner.temp }}/catalogue-report.json
  update-catalogue:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared data branch
        id: prepare
        run: |
          if git fetch origin park-wait-data; then
            git worktree add -b park-wait-data data-publish FETCH_HEAD
          else
            git worktree add -b park-wait-data data-publish HEAD
          fi
      - name: Seed validated last-known facts
        id: seed
        run: |
          python projects/park-itinerary-lab/scripts/update_park_data.py --seed-only --previous-catalogue data-publish/catalogue.json --output data-publish/catalogue.json
          python - <<'PY'
          import pathlib,shutil
          target=pathlib.Path('data-publish/calendar.json')
          if not target.exists():shutil.copyfile('projects/park-itinerary-lab/web/data/calendar.json',target)
          PY
      - name: Refresh official dates, closures and events
        id: facts
        continue-on-error: true
        env:
          VISIT_DATE: ${{ inputs.visit_date }}
        run: |
          python - <<'PY'
          import os,subprocess
          command=['python','projects/park-itinerary-lab/scripts/update_park_data.py','--previous-catalogue','data-publish/catalogue.json','--output','data-publish/catalogue.json']
          if os.environ.get('VISIT_DATE'):command+=['--date',os.environ['VISIT_DATE']]
          subprocess.run(command,check=True)
          PY
      - name: Refresh venue menus independently
        id: menus
        if: always() && steps.prepare.outcome == 'success' && steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          FACTS_OUTCOME: ${{ steps.facts.outcome }}
        run: |
          python - <<'PY'
          import datetime as dt,json,os,pathlib,sys
          sys.path.insert(0,'projects/park-itinerary-lab/scripts')
          import update_food_menus as menus
          target=pathlib.Path('data-publish/catalogue.json')
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          # A failed list fetch may also affect venue pages: try once with a bounded shorter timeout.
          fetcher=menus.fetch_text if os.environ['FACTS_OUTCOME']=='success' else lambda url:menus.fetch_text(url,timeout=4)
          result,report=menus.update_catalogue(json.loads(target.read_text()),date,workers=4,fetcher=fetcher)
          menus.atomic_json(target,result)
          print(f"Food menus: {report['updated']}/{report['checked']} verified, {len(report['errors'])} failed. Previous verified menu facts are retained on failure.")
          PY
      - name: Refresh official holiday calendar independently
        id: calendar
        if: always() && steps.prepare.outcome == 'success' && steps.seed.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib,subprocess
          output=pathlib.Path('data-publish/calendar.json')
          result=subprocess.run(['python','projects/park-itinerary-lab/scripts/update_calendar.py','--output',str(output)])
          report={'checkedAt':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),'status':'complete' if result.returncode==0 else 'failed','lastKnownCalendarUsed':result.returncode!=0}
          pathlib.Path('data-publish/calendar-report.json').write_text(json.dumps(report,indent=2)+'\n')
          if result.returncode:print('Holiday retrieval failed; retained the previous official calendar.')
          raise SystemExit(result.returncode)
          PY
      - name: Publish last-known facts and retrieval report
        id: publish
        if: always() && steps.prepare.outcome == 'success' && steps.seed.outcome == 'success'
        working-directory: data-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.json catalogue-report.json calendar.json
          if [ -f calendar-report.json ]; then git add calendar-report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish checked park facts and retrieval status'
            git push origin HEAD:park-wait-data
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.seed.outcome == 'success'
        with:
          name: park-catalogue-update
          path: |
            data-publish/catalogue*.json
            data-publish/calendar-report.json
      - name: Report retrieval failures explicitly
        if: always() && steps.prepare.outcome == 'success' && steps.seed.outcome == 'success'
        env:
          FACTS_OUTCOME: ${{ steps.facts.outcome }}
          MENUS_OUTCOME: ${{ steps.menus.outcome }}
          CALENDAR_OUTCOME: ${{ steps.calendar.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          facts=json.loads(pathlib.Path('data-publish/catalogue-report.json').read_text())
          catalogue=json.loads(pathlib.Path('data-publish/catalogue.json').read_text())
          food=catalogue.get('foodMenuUpdate',{})
          lines=['## Official park data retrieval',f"Catalogue: {facts.get('status','unknown')}. Last-known facts retained: {facts.get('lastKnownCatalogueUsed',False)}.",f"Official source errors: {len(facts.get('sourceErrors',[]))}.",f"Menus verified: {food.get('updated',0)}/{food.get('checked',0)}; failed venue requests: {len(food.get('errors',[]))}.",f"Holiday retrieval: {os.environ['CALENDAR_OUTCOME']}.",f"Publishing cached facts and reports: {os.environ['PUBLISH_OUTCOME']}."]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as target:target.write('\n\n'.join(lines)+'\n')
          failures=[key for key in ['FACTS_OUTCOME','MENUS_OUTCOME','CALENDAR_OUTCOME','PUBLISH_OUTCOME'] if os.environ[key]!='success']
          if facts.get('status')=='failed' or food.get('status')=='failed' or failures:
              print('Retrieval failed. Last confirmed facts were published; this run does not claim a successful refresh.')
              raise SystemExit(1)
          PY
