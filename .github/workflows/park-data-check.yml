name: Check park catalogue

on:
  workflow_dispatch:
    inputs:
      visit_date:
        description: '照合する日付（YYYY-MM-DD、空欄は日本時間の当日）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official operating and show times
        env:
          VISIT_DATE: ${{ inputs.visit_date }}
        run: |
          if [ -n "$VISIT_DATE" ]; then
            python projects/park-itinerary-lab/scripts/update_park_data.py --date "$VISIT_DATE"
          else
            python projects/park-itinerary-lab/scripts/update_park_data.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: park-catalogue-update
          path: projects/park-itinerary-lab/outputs/catalogue-update*.json
