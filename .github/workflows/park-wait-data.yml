name: Collect park waits and train predictions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/park-wait-data.yml'
      - 'projects/park-itinerary-lab/scripts/collect_wait_data.py'
      - 'projects/park-itinerary-lab/scripts/collect_weather.py'
      - 'projects/park-itinerary-lab/scripts/archive_wait_history.py'
      - 'projects/park-itinerary-lab/scripts/seed_wait_model.py'
      - 'projects/park-itinerary-lab/scripts/bootstrap_wait_history.py'
      - 'projects/park-itinerary-lab/scripts/train_wait_model.py'
      - 'projects/park-itinerary-lab/web/wait-model.js'
      - 'projects/park-itinerary-lab/web/data/queue-times-map.json'
      - 'projects/park-itinerary-lab/web/data/wait-model.json'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 23,0-12 * * *' # 08:07–21:52 JST
    - cron: '55 12 * * *' # 21:55 JST: archive and retrain after closing
    - cron: '15 14,17,20 * * *' # 23:15, 02:15, 05:15 JST: keep overnight forecasts available

permissions:
  contents: write

concurrency:
  group: park-data-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the separate observations branch
        id: prepare
        run: |
          if git fetch origin park-wait-data; then
            git worktree add -b park-wait-data data-publish FETCH_HEAD
          else
            git worktree add -b park-wait-data data-publish HEAD
          fi
      - name: Seed validated fallback models
        id: seed
        run: python projects/park-itinerary-lab/scripts/seed_wait_model.py --published data-publish/wait-model.json --output data-publish/wait-model.json
      - name: Collect documented current waits
        id: collect
        run: python projects/park-itinerary-lab/scripts/collect_wait_data.py --output-dir data-publish
      - name: Refresh the hourly forecast cache
        id: weather
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        run: python projects/park-itinerary-lab/scripts/collect_weather.py --output data-publish/weather-forecast.json
      - name: Archive public observations and prepare private training input
        if: steps.collect.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '55 12 * * *')
        run: |
          python projects/park-itinerary-lab/scripts/archive_wait_history.py --data-dir data-publish
          python - <<'PY'
          import json,os,pathlib,re,shutil
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'park-training';target.mkdir(exist_ok=True)
          data=pathlib.Path('data-publish')
          records=[]
          for source in sorted((data/'history').glob('????-??.json')):
              if source.is_symlink() or not re.fullmatch(r"\d{4}-(?:0[1-9]|1[0-2])\.json",source.name):continue
              records.extend(row for row in json.loads(source.read_text()) if row.get('source')=='queue-times')
          (target/'queue-observations.json').write_text(json.dumps(records,ensure_ascii=False))
          shutil.copyfile(data/'wait-model.json',target/'fallback-model.json')
          for filename in ['catalogue.json','calendar.json']:
              bundled=pathlib.Path('projects/park-itinerary-lab/web/data')/('parks.json' if filename=='catalogue.json' else filename)
              if not (data/filename).exists():shutil.copyfile(bundled,data/filename)
          PY
      - name: Learn from permitted history without publishing private raw data
        env:
          THEMEPARKS_API_KEY: ${{ secrets.THEMEPARKS_API_KEY }}
        if: steps.collect.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '55 12 * * *')
        run: |
          python projects/park-itinerary-lab/scripts/bootstrap_wait_history.py --catalogue data-publish/catalogue.json --calendar data-publish/calendar.json --existing-observations "$RUNNER_TEMP/park-training/queue-observations.json" --output-model data-publish/wait-model.json --fallback-model "$RUNNER_TEMP/park-training/fallback-model.json" --private-dir "$RUNNER_TEMP/park-training/private" --max-history-requests 1000
      - name: Remove private training files
        if: always()
        run: python -c 'import os,pathlib,shutil; shutil.rmtree(pathlib.Path(os.environ["RUNNER_TEMP"])/"park-training",ignore_errors=True)'
      - name: Publish data without rebuilding the application
        if: always() && steps.prepare.outcome == 'success' && steps.seed.outcome == 'success' && (steps.collect.outcome == 'success' || steps.weather.outcome == 'success')
        working-directory: data-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for name in live-waits.json observations.json wait-model.json history-index.json weather-forecast.json; do
            if [ -f "$name" ]; then git add "$name"; fi
          done
          if [ -d history ]; then git add history; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update park waits, predictions and forecast cache'
            git push origin HEAD:park-wait-data
          fi
