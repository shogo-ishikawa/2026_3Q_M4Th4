name: Collect park waits and train predictions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/park-wait-data.yml'
      - 'projects/park-itinerary-lab/scripts/collect_wait_data.py'
      - 'projects/park-itinerary-lab/scripts/collect_weather.py'
      - 'projects/park-itinerary-lab/scripts/archive_daily_weather.py'
      - 'projects/park-itinerary-lab/scripts/issued_training_inputs.py'
      - 'projects/park-itinerary-lab/scripts/observed_wait_summary.py'
      - 'projects/park-itinerary-lab/scripts/archive_wait_history.py'
      - 'projects/park-itinerary-lab/scripts/seed_wait_model.py'
      - 'projects/park-itinerary-lab/scripts/nightly_wait_training.py'
      - 'projects/park-itinerary-lab/scripts/bootstrap_wait_history.py'
      - 'projects/park-itinerary-lab/scripts/train_wait_model.py'
      - 'projects/park-itinerary-lab/scripts/issue_wait_forecast.mjs'
      - 'projects/park-itinerary-lab/scripts/issue_intraday_forecast.mjs'
      - 'projects/park-itinerary-lab/scripts/score_daily_waits.py'
      - 'projects/park-itinerary-lab/scripts/score_wait_history.py'
      - 'projects/park-itinerary-lab/scripts/aggregate_wait_history.mjs'
      - 'projects/park-itinerary-lab/web/forecast-accuracy.js'
      - 'projects/park-itinerary-lab/web/planner.js'
      - 'projects/park-itinerary-lab/web/calendar-features.js'
      - 'projects/park-itinerary-lab/web/ticket-calendar.js'
      - 'projects/park-itinerary-lab/web/ticket-calendar-seed.js'
      - 'projects/park-itinerary-lab/web/wait-model.js'
      - 'projects/park-itinerary-lab/web/intraday-waits.js'
      - 'projects/park-itinerary-lab/web/data/queue-times-map.json'
      - 'projects/park-itinerary-lab/web/data/wait-model.json'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 23,0-12 * * *' # 08:07–21:52 JST
    - cron: '55 12 * * *' # 21:55 JST: archive and retrain after closing
    - cron: '15 14,17,20 * * *' # 23:15, 02:15, 05:15 JST: keep overnight forecasts available

permissions:
  contents: write

concurrency:
  group: park-data-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the separate observations branch
        id: prepare
        run: |
          data_ref=$(git ls-remote --heads origin refs/heads/park-wait-data)
          if [ -n "$data_ref" ]; then
            git fetch origin refs/heads/park-wait-data
            git worktree add -b park-wait-data data-publish FETCH_HEAD
          else
            git worktree add --detach data-publish HEAD
            git -C data-publish switch --orphan park-wait-data
          fi
      - name: Seed validated fallback models
        id: seed
        run: python projects/park-itinerary-lab/scripts/seed_wait_model.py --published data-publish/wait-model.json --output data-publish/wait-model.json
      - name: Collect documented current waits
        id: collect
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python projects/park-itinerary-lab/scripts/collect_wait_data.py --output-dir data-publish
      - name: Refresh the hourly forecast cache
        id: weather
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: python projects/park-itinerary-lab/scripts/collect_weather.py --output data-publish/weather-forecast.json
      - name: Record prospective intraday comparisons from fresh posted waits
        id: intraday
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        continue-on-error: true
        run: node projects/park-itinerary-lab/scripts/issue_intraday_forecast.mjs --data-dir data-publish
      - name: Score frozen forecasts against collected waits after closing
        id: daily_score
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python projects/park-itinerary-lab/scripts/score_daily_waits.py --data-dir data-publish
      - name: Compare the issued weather forecast with hourly AMeDAS measurements after closing
        if: ${{ !cancelled() && steps.daily_score.outcome == 'success' }}
        continue-on-error: true
        run: python projects/park-itinerary-lab/scripts/archive_daily_weather.py --data-dir data-publish
      - name: Archive collected waits and train through the latest completed park day
        if: ${{ !cancelled() && steps.daily_score.outcome == 'success' && steps.seed.outcome == 'success' }}
        run: |
          python projects/park-itinerary-lab/scripts/nightly_wait_training.py --data-dir data-publish ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Record the forecast for future park hours
        id: forecast
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: node projects/park-itinerary-lab/scripts/issue_wait_forecast.mjs --data-dir data-publish
      - name: Supplement the local report with recent provider history
        id: external_score
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        env:
          THEMEPARKS_API_KEY: ${{ secrets.THEMEPARKS_API_KEY }}
        run: timeout 3m python projects/park-itinerary-lab/scripts/score_wait_history.py --data-dir data-publish
      - name: Publish data without rebuilding the application
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: data-publish
        env:
          SEED_STATUS: ${{ steps.seed.outcome }}
          COLLECT_STATUS: ${{ steps.collect.outcome }}
          WEATHER_STATUS: ${{ steps.weather.outcome }}
          FORECAST_STATUS: ${{ steps.forecast.outcome }}
          EXTERNAL_SCORE_STATUS: ${{ steps.external_score.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$COLLECT_STATUS" = success ]; then git add live-waits.json observations.json; fi
          if [ "$WEATHER_STATUS" = success ] && [ -f weather-forecast.json ]; then git add weather-forecast.json; fi
          if [ "$SEED_STATUS" = success ]; then
            for name in wait-model.json history-index.json training-state.json; do
              if [ -f "$name" ]; then git add "$name"; fi
            done
            if [ -d history ]; then git add history; fi
          fi
          # Score writers publish each completed file atomically, even if another park or date fails.
          shopt -s nullglob
          reports=({accuracy-daily,accuracy-history,weather-daily}/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json)
          if (( ${#reports[@]} )); then git add -- "${reports[@]}"; fi
          if [ -f accuracy-history/state.json ]; then git add accuracy-history/state.json; fi
          if [ "$EXTERNAL_SCORE_STATUS" = failure ]; then
            echo "::warning::Supplementary provider history is unavailable. See the local daily report and the history step log."
          fi
          if [ "$FORECAST_STATUS" = success ] && [ -d forecasts ]; then git add forecasts; fi
          if [ -d forecasts-intraday ]; then
            git ls-files --others --exclude-standard -z -- ':(glob)forecasts-intraday/????-??-??/*-[0-9][0-9][0-9][0-9].json' | xargs -0 -r git add --
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update park observations, models and forecasts'
            # The separate official catalogue updater may have published since checkout.
            git push origin HEAD:park-wait-data || {
              git fetch origin park-wait-data
              git rebase FETCH_HEAD
              git push origin HEAD:park-wait-data
            }
          fi
