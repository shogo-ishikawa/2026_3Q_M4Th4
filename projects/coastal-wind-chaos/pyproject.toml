[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-wind-chaos"
version = "0.1.0"
description = "海辺の風の予測可能性を、風向きの機械学習予測とローレンツ系の実験から学ぶ教材"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
