# 予測時間・手法・シナリオを増やした設定（CPUだけで数分程度を想定）。
# パスは作品フォルダ projects/coastal-wind-chaos/ を基準にします。
# 使い方：python scripts/run_experiments.py --config configs/full.toml

[sample_data]
preset = "default"
seed = 2026
years = 3
output = "data/sample_coastal_amedas.csv"
truth_output = "data/sample_coastal_truth.csv"

[wind]
horizons = [1, 2, 3, 6, 9, 12, 18, 24, 30, 36, 42, 48]
lags = [0, 1, 2, 3, 6, 12, 24]
models = [
  "persistence",
  "climatology",
  "linear:calendar",
  "linear:recent",
  "linear:calendar+recent",
  "boosting:calendar",
  "boosting:calendar+recent",
  "degrees_as_numbers",
]
test_days = 365
min_quality = 5
seed = 0
hourly_error_horizon = 6

[scenarios]
enabled = true
names = ["periodic_only", "periodic_ar", "default", "no_precursor"]
horizons = [1, 3, 6, 12, 18, 24, 36, 48]
models = ["persistence", "climatology", "linear:calendar+recent", "boosting:calendar+recent"]

[lorenz]
n_start_points = 40
perturbation_sizes = [1e-12, 1e-10, 1e-8, 1e-6, 1e-4, 1e-2]
n_steps = 4000
dt = 0.01
tolerance = 1.0
benettin_steps = 100000
seed = 0
