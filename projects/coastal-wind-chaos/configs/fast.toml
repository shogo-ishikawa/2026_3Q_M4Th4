# 授業中にすぐ試すための軽い設定（CPUだけで1分以内を想定）。
# パスは作品フォルダ projects/coastal-wind-chaos/ を基準にします。
# 使い方：python scripts/run_experiments.py --config configs/fast.toml

[sample_data]
# データファイルがないときに、この設定で合成データを作ります。
preset = "default"            # default, periodic_only, periodic_ar, no_precursor
seed = 2026
years = 3
output = "data/sample_coastal_amedas.csv"
truth_output = "data/sample_coastal_truth.csv"

[wind]
horizons = [1, 3, 6, 12, 24, 48]          # 何時間先を予測するか
lags = [0, 1, 2, 3, 6, 12, 24]            # 直近の観測として使う「何時間前」の値
models = [
  "persistence",
  "climatology",
  "linear:calendar",
  "linear:recent",
  "linear:calendar+recent",
  "boosting:calendar+recent",
  "degrees_as_numbers",
]
test_days = 365                           # 最後の何日をテスト期間にするか
min_quality = 5                           # 使う品質情報の下限（8 正常値, 5 準正常値）
seed = 0
hourly_error_horizon = 6                  # 時刻別の誤差を描く予測時間

[scenarios]
# 合成データの成分を変えて、同じ手法の誤差を比べます（実データでは意味を持ちません）。
enabled = true
names = ["periodic_only", "periodic_ar"]
horizons = [1, 3, 6, 12, 24, 48]
models = ["persistence", "climatology", "linear:calendar+recent"]

[lorenz]
# ローレンツ系の時間は無次元です。時間（hour）には換算しません。
n_start_points = 10
perturbation_sizes = [1e-10, 1e-8, 1e-6, 1e-4, 1e-2]
n_steps = 3000
dt = 0.01
tolerance = 1.0
benettin_steps = 20000
seed = 0
